<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>译课 · AI 课程中文翻译</title>
<meta name="description" content="OpenAI 与 Anthropic 官方 AI 课程的简体中文翻译，免费开放，随手学。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1C1B1A;--muted:#5C574E;--faint:#8A8478;--line:#ECE8E0;--accent:#C2540A;--accent-bg:#FDF0E4;--bg:#FAF9F6;--card:#fff}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;background:rgba(250,249,246,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:20}
.nav-in{max-width:1120px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:28px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo em{font-style:normal;color:var(--accent)}
.nav a.link{color:var(--muted);font-size:14px}
.nav a.link.on{color:var(--ink);font-weight:600}
.nav .right{margin-left:auto;display:flex;gap:20px;align-items:center}
.btn{background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px}
.hero{max-width:1120px;margin:0 auto;padding:72px 24px 16px}
.kicker{display:inline-block;background:var(--accent-bg);color:var(--accent);font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;margin-bottom:20px}
.hero h1{font-size:52px;line-height:1.15;letter-spacing:-.03em;font-weight:800;max-width:760px}
.hero h1 .hl{color:var(--accent)}
.hero p{margin-top:18px;font-size:18px;color:var(--muted);max-width:580px}
.stats{display:flex;gap:40px;margin-top:36px;flex-wrap:wrap}
.stat b{font-size:28px;display:block;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--faint)}
.wrap{max-width:1120px;margin:0 auto;padding:8px 24px 24px}
.sec-title{font-size:22px;font-weight:700;margin:40px 0 6px;letter-spacing:-.01em}
.sec-sub{color:var(--faint);font-size:14px;margin-bottom:18px}
.cat-title{font-size:15px;font-weight:700;color:var(--muted);margin:26px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;transition:.2s}
a.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(28,27,26,.09);border-color:#E2DCD0}
.card .brand{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--faint)}
.card h3{font-size:19px;margin:8px 0 6px;letter-spacing:-.01em}
.card p{font-size:14px;color:var(--muted);min-height:44px}
.meta{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:13px;color:var(--faint)}
.pill{margin-left:auto;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.done{background:#E5F4EA;color:#177245}
.doing{background:var(--accent-bg);color:var(--accent)}
.todo{background:#F0EEE9;color:var(--faint)}
.bar{height:6px;background:#F0EEE9;border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.page-head{max-width:1120px;margin:0 auto;padding:48px 24px 0}
.page-head h1{font-size:36px;letter-spacing:-.02em}
.page-head p{color:var(--muted);margin-top:8px}
.crumb{max-width:820px;margin:0 auto;padding:28px 24px 0;font-size:13px;color:var(--faint)}
.crumb a:hover{color:var(--accent)}
.lesson{max-width:820px;margin:14px auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:44px 48px}
.lesson h1{font-size:30px;letter-spacing:-.02em;margin-bottom:14px;line-height:1.3}
.lesson h2{font-size:22px;margin:34px 0 10px;letter-spacing:-.01em}
.lesson h3{font-size:18px;margin:26px 0 8px}
.lesson p{color:#33302B;margin-bottom:13px;line-height:1.9}
.lesson ul,.lesson ol{margin:0 0 14px 22px;color:#33302B;line-height:1.9}
.lesson li{margin-bottom:4px}
.lesson a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.lesson code{background:#F4F1EA;padding:2px 7px;border-radius:6px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}
.lesson pre{background:var(--ink);color:#F2EFE9;border-radius:12px;padding:16px 20px;font-size:14px;overflow:auto;margin:12px 0;line-height:1.6}
.lesson pre code{background:none;padding:0;color:inherit}
.lesson blockquote{border-left:3px solid var(--accent);background:var(--accent-bg);padding:12px 18px;border-radius:0 12px 12px 0;margin:14px 0;color:#4A4238}
.lesson blockquote p{margin:0;color:#4A4238}
.lesson table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px}
.lesson th,.lesson td{border:1px solid var(--line);padding:9px 12px;text-align:left}
.lesson th{background:#F7F4EE}
.lesson hr{border:none;border-top:1px solid var(--line);margin:26px 0}
.loading{max-width:820px;margin:60px auto;padding:0 24px;color:var(--faint)}
footer{max-width:1120px;margin:0 auto;padding:48px 24px 60px;color:var(--faint);font-size:13px;line-height:1.9}
footer .cols{display:flex;gap:40px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:28px}
footer b{color:var(--muted)}
@media(max-width:640px){.hero h1{font-size:36px}.hero{padding-top:48px}.lesson{padding:28px 22px}.stats{gap:24px}.nav a.link.hideS{display:none}}
</style>
</head>
<body>
<div class="nav"><div class="nav-in">
<a class="logo" href="#/">译课<em>.</em></a>
<a class="link" data-nav="openai" href="#/openai">OpenAI</a>
<a class="link" data-nav="anthropic" href="#/anthropic">Anthropic</a>
<a class="link hideS" data-nav="guide" href="#/guide">翻译规范</a>
<a class="link hideS" data-nav="glossary" href="#/glossary">术语表</a>
<div class="right"><a class="link hideS" href="https://github.com/fearchen/fearchen.github.io" target="_blank" rel="noopener">GitHub</a><a class="btn" href="#/anthropic/claude-code-in-action">开始学习</a></div>
</div></div>

<main id="app"></main>

<footer><div class="cols">
<div><b>译课</b><br>非官方个人翻译项目，仅供学习交流，请勿商用。<br>全部课程内容版权归原作者及所属机构所有，译文与原文不一致时以原文为准。</div>
<div><b>源站</b><br><a href="https://academy.openai.com/" target="_blank" rel="noopener">OpenAI Academy</a><br><a href="https://academy.claude.com/" target="_blank" rel="noopener">Claude Academy</a></div>
<div><b>本站</b><br><a href="#/guide">翻译规范</a><br><a href="#/glossary">术语表</a><br><a href="https://fearchen.github.io/blog/">原博客（运维笔记）</a></div>
</div></footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
var CATALOG = {
openai: { name:"OpenAI Academy", short:"OpenAI", home:"https://academy.openai.com/",
  cats:[
   {title:"在工作中应用 AI", courses:[
    {slug:"ai-foundations",cn:"AI 基础",en:"AI Foundations",mins:"60–75 分钟",status:"todo",desc:"AI 基础知识、写清晰的提示词、补充上下文、审核输出、负责任地使用 AI。"},
    {slug:"applied-ai-foundations",cn:"AI 应用基础",en:"Applied AI Foundations",mins:"75–90 分钟",status:"todo",desc:"把工作拆解为步骤，构建带有审核节点、可重复使用的工作流。"},
    {slug:"agents-and-workflows",cn:"智能体与工作流",en:"Agents and Workflows",mins:"75–90 分钟",status:"doing",progress:8,desc:"把结构化任务委派给智能体：给上下文、定边界、设检查点，人工审核后再放行。"}]},
   {title:"利用 AI 开发", courses:[
    {slug:"scoping-ai-solutions",cn:"界定 AI 解决方案的范围",en:"Scoping AI Solutions",mins:"30 分钟",status:"todo",desc:"发现有价值的 AI 应用机会，并为选定场景制定解决方案计划。"},
    {slug:"evaluating-ai-apps",cn:"评估 AI 应用",en:"Evaluating AI Applications",mins:"70 分钟",status:"todo",desc:"构建有代表性的评估、诊断失败原因、防止质量退化。"},
    {slug:"design-build-agentic-systems",cn:"设计与构建智能体系统",en:"Design and Build Agentic Systems",mins:"110 分钟",status:"todo",desc:"设计可靠的智能体：角色清晰、工具使用可控、任务交接安全。"},
    {slug:"build-with-rag",cn:"利用 RAG 进行开发",en:"Build with RAG",mins:"100 分钟",status:"todo",desc:"构建检索流水线，并评估生成答案的质量。"},
    {slug:"optimizing-ai-performance",cn:"优化 AI 应用性能",en:"Optimize AI Application Performance",mins:"30 分钟",status:"todo",desc:"依据生产数据平衡质量、延迟、吞吐量、可靠性与成本。"}]},
   {title:"Codex", courses:[
    {slug:"codex-intro",cn:"Codex 入门",en:"Codex Intro",mins:"80 分钟",status:"todo",desc:"界定仓库编程任务的范围、验证代码更改、为审核提供明确依据。"},
    {slug:"scaling-codex-workflows",cn:"扩展 Codex 工作流",en:"Scaling Codex Workflows",mins:"90 分钟",status:"todo",desc:"把有效的 Codex 实践转化为可重复的团队工作流并建立监督机制。"},
    {slug:"scaling-codex-governance",cn:"规模化应用 Codex",en:"Scaling Codex with Governance",mins:"100 分钟",status:"todo",desc:"协调并行的 Codex 工作流、管理治理工作、安全地整合输出成果。"}]},
   {title:"引领与教学", courses:[
    {slug:"ai-leadership",cn:"AI 领导力",en:"AI Leadership",mins:"180 分钟",status:"todo",desc:"确定业务优先事项、推动共识、起草涵盖治理与路线图的 AI 战略。"},
    {slug:"ai-for-educators",cn:"面向教育工作者的 AI",en:"AI for Educators",mins:"45 分钟",status:"todo",desc:"编写教案、设计活动与测评，并根据学习目标审核输出内容。"},
    {slug:"ai-for-students",cn:"面向大学生的 AI",en:"AI for College Students",mins:"45 分钟",status:"todo",desc:"制定学习计划、协作与写作、准备申请和面试，批判性审视 AI 回答。"}]}
  ]},
anthropic: { name:"Claude Academy", short:"Anthropic", home:"https://academy.claude.com/",
  cats:[
   {title:"基础", courses:[
    {slug:"claude-101",cn:"Claude 101",en:"Claude 101",mins:"自学",status:"todo",desc:"日常使用 Claude 的基本功：提问、Projects、Artifacts 与 Skills。"},
    {slug:"claude-platform-101",cn:"Claude Platform 101",en:"Claude Platform 101",mins:"自学",status:"todo",desc:"Claude 平台总览——官方暂无繁中版的一门。"},
    {slug:"claude-cowork-intro",cn:"Claude Cowork 简介",en:"Introduction to Claude Cowork",mins:"自学",status:"todo",desc:"Claude Cowork 入门介绍。"}]},
   {title:"Claude Code", courses:[
    {slug:"claude-code-101",cn:"Claude Code 101",en:"Claude Code 101",mins:"约 1.5 小时",status:"todo",desc:"Claude Code 是什么、智能体循环如何工作、日常编码工作流。"},
    {slug:"claude-code-in-action",cn:"Claude Code 实战",en:"Claude Code in Action",mins:"9 课 · 约 1 小时",status:"doing",progress:11,desc:"驾驭长会话、写 Claude 真正照做的 CLAUDE.md、钩子与权限模式、验证无人值守的运行。"}]},
   {title:"智能体与协议", courses:[
    {slug:"intro-agent-skills",cn:"代理技能简介",en:"Introduction to agent skills",mins:"自学",status:"todo",desc:"Agent Skills 的概念与用法：把重复流程打包成可复用的技能。"},
    {slug:"intro-subagents",cn:"子代理入门",en:"Introduction to subagents",mins:"自学",status:"todo",desc:"子代理的概念与用法入门。"},
    {slug:"intro-mcp",cn:"MCP 简介",en:"Introduction to MCP",mins:"自学",status:"todo",desc:"模型上下文协议（MCP）入门。"},
    {slug:"mcp-advanced",cn:"MCP 进阶主题",en:"MCP: Advanced Topics",mins:"自学",status:"todo",desc:"MCP 进阶：采样、通知与传输等主题。"}]},
   {title:"API 开发", courses:[
    {slug:"building-with-claude-api",cn:"Claude API 开发",en:"Building with the Claude API",mins:"自学",status:"todo",desc:"使用 Claude API 构建应用。"}]}
  ]}
};
var PILL = {done:["done","已完成"], doing:["doing","翻译中"], todo:["todo","待翻译"]};
function allCourses(a){var r=[];CATALOG[a].cats.forEach(function(c){c.courses.forEach(function(x){x.cat=c.title;r.push(x)})});return r}
function card(a,c){
  var p=PILL[c.status];
  var bar = c.progress!=null ? '<div class="bar"><i style="width:'+c.progress+'%"></i></div>' : '';
  return '<a class="card" href="#/'+a+'/'+c.slug+'"><div class="brand">'+CATALOG[a].short.toUpperCase()+' · '+c.cat+'</div><h3>'+c.cn+'</h3><p>'+c.desc+'</p><div class="meta"><span>'+c.mins+'</span><span class="pill '+p[0]+'">'+p[1]+'</span></div>'+bar+'</a>';
}
function grid(a,list){return '<div class="grid">'+list.map(function(c){return card(a,c)}).join("")+'</div>'}
function home(){
  var total=0; Object.keys(CATALOG).forEach(function(a){total+=allCourses(a).length});
  var feat=[["anthropic",allCourses("anthropic").filter(function(c){return c.slug==="claude-code-in-action"})[0]],
            ["openai",allCourses("openai").filter(function(c){return c.slug==="agents-and-workflows"})[0]],
            ["anthropic",allCourses("anthropic").filter(function(c){return c.slug==="intro-agent-skills"})[0]]];
  var h='<div class="hero"><span class="kicker">非官方翻译 · 免费开放</span><h1>把最好的 AI 官方课程，<br>翻成<span class="hl">中文</span>给你看</h1><p>OpenAI 与 Anthropic 的官方课程，逐课忠实翻译，代码与命令保留原文，手机上随手就能学。</p><div class="stats"><div class="stat"><b>2</b><span>官方源站</span></div><div class="stat"><b>'+total+'</b><span>课程总数</span></div><div class="stat"><b>3</b><span>已译课次</span></div><div class="stat"><b>100%</b><span>免费</span></div></div></div>';
  h+='<div class="wrap"><div class="sec-title">正在翻译</div><div class="sec-sub">最新进度，先看这些</div><div class="grid">'+feat.map(function(f){return card(f[0],f[1])}).join("")+'</div>';
  Object.keys(CATALOG).forEach(function(a){
    h+='<div class="sec-title">'+CATALOG[a].name+'</div><div class="sec-sub">原站：<a href="'+CATALOG[a].home+'" target="_blank" rel="noopener" style="text-decoration:underline">'+CATALOG[a].home.replace("https://","").replace(/\/$/,"")+'</a></div>'+grid(a,allCourses(a));
  });
  h+='</div>';
  return h;
}
function section(a){
  var A=CATALOG[a];
  var h='<div class="page-head"><h1>'+A.name+'</h1><p>'+(a==="openai"?"官方只有英文版，本站优先翻译。":"官方已有繁体中文版，本站提供简体中文版。")+'</p></div><div class="wrap">';
  A.cats.forEach(function(c){ h+='<div class="cat-title">'+c.title+'</div>'+grid(a,c.courses); });
  return h+'</div>';
}
function rewriteLinks(root){
  root.querySelectorAll("a[href]").forEach(function(el){
    var href=el.getAttribute("href");
    if(/^(https?:|mailto:|#\/)/.test(href)) return;
    if(href==="README.md"||href==="/"){el.setAttribute("href","#/");return}
    if(href==="guide.md"){el.setAttribute("href","#/guide");return}
    if(href==="glossary.md"){el.setAttribute("href","#/glossary");return}
    if(/^(openai|anthropic)\/README\.md$/.test(href)){el.setAttribute("href","#/"+href.split("/")[0]);return}
    if(/\.md$/.test(href)){el.setAttribute("href","#/"+href.replace(/\.md$/,""));return}
  });
}
function crumbFor(path){
  var parts=path.split("/");
  if(parts.length===2 && CATALOG[parts[0]]){
    var cs=allCourses(parts[0]).filter(function(c){return c.slug===parts[1]});
    var cn=cs.length?cs[0].cn:parts[1];
    return '<div class="crumb"><a href="#/">首页</a> / <a href="#/'+parts[0]+'">'+CATALOG[parts[0]].name+'</a> / '+cn+'</div>';
  }
  if(path==="guide") return '<div class="crumb"><a href="#/">首页</a> / 翻译规范</div>';
  if(path==="glossary") return '<div class="crumb"><a href="#/">首页</a> / 术语表</div>';
  return "";
}
function render(){
  var app=document.getElementById("app");
  var path=(location.hash||"#/").replace(/^#\/?/,"").replace(/\/$/,"");
  document.querySelectorAll(".nav a.link[data-nav]").forEach(function(el){el.classList.toggle("on", path===el.getAttribute("data-nav")||path.indexOf(el.getAttribute("data-nav")+"/")===0)});
  window.scrollTo(0,0);
  if(path===""){app.innerHTML=home();return}
  if(path==="openai"||path==="anthropic"){app.innerHTML=section(path);return}
  app.innerHTML='<div class="loading">加载中…</div>';
  fetch(path+".md").then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(md){
    app.innerHTML=crumbFor(path)+'<div class="lesson">'+marked.parse(md)+'</div>';
    rewriteLinks(app);
  }).catch(function(){app.innerHTML='<div class="loading">页面不存在或加载失败。<a href="#/" style="color:var(--accent)">回到首页</a></div>'});
}
window.addEventListener("hashchange",render);
render();
</script>
</body>
</html>
